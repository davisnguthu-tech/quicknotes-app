<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Toolkit - QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div>
            <h1>QuickNotes</h1>
            <p>Organize your thoughts quickly and efficiently</p>
        </div>
        <button id="theme-toggle">Dark mode</button>
    </header>

    <main>
        <!-- Section 1: Add Note Form (Built around your original textarea & counters) -->
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <div class="input-group">
                    <label for="note-text">Note Text:</label>
                    <textarea id="note-text" placeholder="Type your note here..."></textarea>
                </div>

                <div class="counters">
                    <p id="char-count">0 / 200 characters</p>
                    <p id="word-count">0 words</p>
                </div>

                <div class="input-group">
                    <label for="note-category">Category:</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="add-btn">Add Note</button>
                    <button type="button" id="clear-btn">Clear</button>
                </div>
            </form>

            <p id="error-message" class="error-message"></p>
        </section>

        <!-- Section 2: Display & Search Notes -->
        <section>
            <div class="section-header">
                <h2>Your notes</h2>
                <button id="clear-all-btn" class="danger-btn">Clear all</button>
            </div>

            <div class="search-container">
                <label for="search-input">Search notes:</label>
                <input type="text" id="search-input" placeholder="Type to filter notes...">
            </div>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; QuickNotes App. Built for Web Foundations.</p>
    </footer>
</body>
</html>
